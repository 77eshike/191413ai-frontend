name: Deploy Storybook

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies
        run: |
          corepack enable
          yarn install --frozen-lockfile

      - name: Build Storybook
        run: |
          set -e  # 构建失败立即退出
          echo "🛠️ 开始构建 Storybook..."
          yarn build-storybook
          echo "✅ 构建完成"

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.STORYBOOK_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H ${{ secrets.STORYBOOK_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy via rsync
        run: |
          echo "🚀 开始部署 Storybook 到远程服务器..."
          rsync -avzr --delete ./storybook-static/ ${{ secrets.STORYBOOK_USER }}@${{ secrets.STORYBOOK_HOST }}:${{ secrets.STORYBOOK_TARGET_DIR }}
          echo "✅ 部署完成"

      - name: Verify Upload (Optional)
        run: |
          echo "🧪 请在浏览器访问: https://${{ secrets.STORYBOOK_HOST }} 或 storybook.191413.ai"
